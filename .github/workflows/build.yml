name: Native development builds
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Locate Inno Setup compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $installed = (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -or (Test-Path "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          if (-not $iscc -and -not $installed) {
            choco install innosetup --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed ($LASTEXITCODE)." }
          }
      - name: Build, test, package and verify Windows installer
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Installer -VerifyInstaller
      - uses: actions/upload-artifact@v4
        with:
          name: Snapliq-windows-x64-development
          if-no-files-found: error
          path: |
            outputs/windows/Snapliq.exe
            outputs/windows/Snapliq-*-windows-x64-development-setup.exe
            outputs/windows/Snapliq-*-windows-x64-development-portable.zip
            outputs/windows/README.zh-CN.txt
            outputs/windows/SHA256SUMS.txt
      - name: Upload Windows validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Snapliq-windows-package-validation
          if-no-files-found: ignore
          path: outputs/windows/diagnostics/
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: zsh scripts/build-macos.sh
      - run: zsh scripts/test-macos.sh
      - run: zsh scripts/test-quick-recording-macos.sh
      - run: zsh scripts/test-orb-macos.sh
      - run: zsh scripts/package-macos-dmg.sh
      - run: python3 scripts/package-development.py --desktop-only
      - uses: actions/upload-artifact@v4
        with:
          name: Snapliq-macOS-development
          path: |
            outputs/Snapliq-*-macOS-arm64-development.zip
            outputs/Snapliq-*-macOS-arm64-development.dmg
